<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Spotter Network Public Feed</title>
    <style>
        /* Previous styles remain the same */
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #7dd3fc;
        }
        /* ... rest of your existing styles ... */
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌪️ Spotter Network Updates</h1>
            <p>Public Bluesky Posts</p>
        </div>
        <div id="feed">
            <div class="loading">Loading public posts...</div>
        </div>
    </div>

    <script type="module">
        import { BskyAgent } from 'https://cdn.jsdelivr.net/npm/@atproto/api@0.6.4/+esm';

        const agent = new BskyAgent({
            service: 'https://bsky.social'
        });

        async function getPublicPosts() {
            try {
                console.log('Fetching profile...');
                const profile = await agent.getProfile({
                    actor: 'spotternetwork.org'
                });

                if (!profile.success) {
                    throw new Error('Profile not found');
                }

                console.log('Fetching feed for DID:', profile.data.did);
                const response = await agent.getAuthorFeed({
                    actor: profile.data.did,
                    limit: 30
                });

                return response.data.feed;
            } catch (error) {
                console.error('API Error:', error);
                throw new Error(`Failed to load posts: ${error.message}`);
            }
        }

        function renderPosts(posts) {
            const feed = document.getElementById('feed');
            feed.innerHTML = '';

            posts.forEach(post => {
                const card = document.createElement('div');
                card.className = 'post-card';
                card.innerHTML = `
                    <div class="post-content">${post.post.record.text.replace(/\n/g, '<br>')}</div>
                    <div style="margin-top: 1rem; color: #94a3b8;">
                        ${new Date(post.post.record.createdAt).toLocaleDateString()} • 
                        <a href="https://bsky.app/profile/spotternetwork.org/post/${post.post.uri.split('/').pop()}" 
                           class="post-link" 
                           target="_blank">
                            View on Bluesky ↗
                        </a>
                    </div>
                `;
                feed.appendChild(card);
            });
        }

        async function loadFeed() {
            try {
                console.log('Starting feed load...');
                
                // Remove authentication for public access
                const posts = await getPublicPosts();
                
                if (!posts || posts.length === 0) {
                    throw new Error('No public posts found (try refreshing)');
                }
                
                console.log('Rendering posts:', posts);
                document.getElementById('feed').innerHTML = '';
                renderPosts(posts);
                
            } catch (error) {
                console.error('Load error:', error);
                document.getElementById('feed').innerHTML = `
                    <div class="error">
                        ${error.message}<br>
                        Open browser console (F12) for details
                    </div>
                `;
            }
        }

        // Add debug info
        console.log('Bluesky API Client Version:', BskyAgent);
        loadFeed();
    </script>
</body>
</html>
