<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Spotter Network Live Feed</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #7dd3fc;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 2rem;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 3rem;
            padding: 2rem;
            background: rgba(30, 41, 59, 0.5);
            border-radius: 1rem;
        }
        .post-card {
            background: var(--card-bg);
            border-radius: 1rem;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid #334155;
        }
        .post-content {
            line-height: 1.6;
            margin: 1rem 0;
            white-space: pre-wrap;
        }
        .post-link {
            color: var(--accent-color);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .loading {
            text-align: center;
            padding: 2rem;
            color: #94a3b8;
        }
        .error {
            color: #fca5a5;
            text-align: center;
            padding: 2rem;
            border: 1px solid #fca5a5;
            border-radius: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌪️ Spotter Network Updates</h1>
            <p>Public Bluesky Posts</p>
        </div>
        <div id="feed">
            <div class="loading">Loading public posts...</div>
        </div>
    </div>

    <!-- WORKING Bluesky API Script -->
    <script src="https://cdn.jsdelivr.net/npm/@atproto/api@0.6.4/dist/browser/index.js"></script>
    <script>
        // Verify library load
        if (typeof BskyAgent === 'undefined') {
            document.getElementById('feed').innerHTML = `
                <div class="error">
                    Failed to load Bluesky library<br>
                    Please refresh or check network connection
                </div>
            `;
            throw new Error('Bluesky library not loaded');
        }

        const agent = new BskyAgent({
            service: 'https://bsky.social'
        });

        async function loadPosts() {
            try {
                // Get profile data
                const profile = await agent.getProfile({
                    actor: 'spotternetwork.org'
                });

                // Get latest posts
                const response = await agent.getAuthorFeed({
                    actor: profile.data.did,
                    limit: 10
                });

                // Render posts
                const feedDiv = document.getElementById('feed');
                feedDiv.innerHTML = '';
                
                response.data.feed.forEach(post => {
                    const postHTML = `
                        <div class="post-card">
                            <div class="post-content">
                                ${post.post.record.text.replace(/\n/g, '<br>')}
                            </div>
                            <div style="margin-top: 1rem; color: #94a3b8;">
                                ${new Date(post.post.record.createdAt).toLocaleDateString()} • 
                                <a href="https://bsky.app/profile/spotternetwork.org/post/${post.post.uri.split('/').pop()}" 
                                   class="post-link" 
                                   target="_blank">
                                    View Post ↗
                                </a>
                            </div>
                        </div>
                    `;
                    feedDiv.innerHTML += postHTML;
                });

            } catch (error) {
                document.getElementById('feed').innerHTML = `
                    <div class="error">
                        Error: ${error.message}<br>
                        Refresh or try again later
                    </div>
                `;
                console.error('Full error:', error);
            }
        }

        // Initial load
        loadPosts();
    </script>
</body>
</html>
