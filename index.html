<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Spotter Network Live Feed</title>
    <style>
        /* Previous styles remain unchanged */
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #7dd3fc;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 2rem;
        }
        /* ... rest of your styles ... */
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌪️ Spotter Network Updates</h1>
            <p>Public Bluesky Posts</p>
        </div>
        <div id="feed">
            <div class="loading">Loading public posts...</div>
        </div>
    </div>

    <!-- Updated working Bluesky API script -->
    <script src="https://unpkg.com/@atproto/api@0.6.4/dist/browser/index.js"></script>
    <script>
        // Check if library loaded successfully
        function checkLibraryLoaded() {
            if (typeof BskyAgent === 'undefined') {
                document.getElementById('feed').innerHTML = `
                    <div class="error">
                        ❌ Required library failed to load!<br>
                        Try these solutions:<br>
                        1. Disable ad blockers<br>
                        2. Check network connection<br>
                        3. Wait 2 minutes and refresh<br>
                        4. Contact site administrator
                    </div>
                `;
                throw new Error('Bluesky library failed to load from CDN');
            }
            return true;
        }

        // Initialize after library check
        if (checkLibraryLoaded()) {
            const agent = new BskyAgent({
                service: 'https://bsky.social'
            });

            async function loadPosts() {
                try {
                    const profile = await agent.getProfile({
                        actor: 'spotternetwork.org'
                    });

                    const feed = await agent.getAuthorFeed({
                        actor: profile.data.did,
                        limit: 10
                    });

                    const feedContainer = document.getElementById('feed');
                    feedContainer.innerHTML = '';

                    feed.data.feed.forEach(post => {
                        feedContainer.innerHTML += `
                            <div class="post-card">
                                <div class="post-content">
                                    ${post.post.record.text.replace(/\n/g, '<br>')}
                                </div>
                                <div style="margin-top: 1rem; color: #94a3b8;">
                                    ${new Date(post.post.record.createdAt).toLocaleDateString()} • 
                                    <a href="https://bsky.app/profile/spotternetwork.org/post/${post.post.uri.split('/').pop()}" 
                                       class="post-link" 
                                       target="_blank">
                                        View Post ↗
                                    </a>
                                </div>
                            </div>
                        `;
                    });

                } catch (error) {
                    document.getElementById('feed').innerHTML = `
                        <div class="error">
                            🚨 Error: ${error.message}<br>
                            Please try refreshing the page
                        </div>
                    `;
                }
            }

            // Start loading posts
            loadPosts();
        }
    </script>
</body>
</html>
