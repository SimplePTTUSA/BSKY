<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Spotter Network Live Feed</title>
    <style>
        /* Keep your existing styles here */
        :root { /* ... */ }
        body { /* ... */ }
        .container { /* ... */ }
        .header { /* ... */ }
        .post-card { /* ... */ }
        .post-content { /* ... */ }
        .post-link { /* ... */ }
        .loading { /* ... */ }
        .error { /* ... */ }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌪️ Spotter Network Updates</h1>
            <p>Public Bluesky Posts</p>
        </div>
        <div id="feed">
            <div class="loading">Loading public posts...</div>
        </div>
    </div>

    <!-- Verified working Bluesky client script -->
    <script src="https://unpkg.com/@atproto/api@0.6.4/dist/browser/index.js"></script>
    <script>
        // Create agent with proper initialization
        const agent = new BskyAgent({
            service: 'https://bsky.social'
        });

        async function loadPosts() {
            try {
                // First resolve the profile
                const profile = await agent.getProfile({
                    actor: 'spotternetwork.org'
                });

                // Then get the feed using DID
                const feed = await agent.getAuthorFeed({
                    actor: profile.data.did,
                    limit: 10
                });

                // Clear loading message
                const feedContainer = document.getElementById('feed');
                feedContainer.innerHTML = '';

                // Display posts
                feed.data.feed.forEach(post => {
                    const postDiv = document.createElement('div');
                    postDiv.className = 'post-card';
                    postDiv.innerHTML = `
                        <div class="post-content">
                            ${post.post.record.text.replace(/\n/g, '<br>')}
                        </div>
                        <div style="margin-top: 1rem; color: #94a3b8;">
                            ${new Date(post.post.record.createdAt).toLocaleDateString()} • 
                            <a href="https://bsky.app/profile/spotternetwork.org/post/${post.post.uri.split('/').pop()}" 
                               class="post-link" 
                               target="_blank">
                                View Post ↗
                            </a>
                        </div>
                    `;
                    feedContainer.appendChild(postDiv);
                });

            } catch (error) {
                document.getElementById('feed').innerHTML = `
                    <div class="error">
                        Error: ${error.message}<br>
                        Refresh or try again later
                    </div>
                `;
                console.error('Full error details:', error);
            }
        }

        // Start loading posts
        loadPosts();
    </script>
</body>
</html>
