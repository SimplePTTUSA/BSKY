<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Spotter Network Live Feed</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #7dd3fc;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 2rem;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
            padding: 2rem;
            background: rgba(30, 41, 59, 0.5);
            border-radius: 1rem;
        }

        .post-card {
            background: var(--card-bg);
            border-radius: 1rem;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid #334155;
        }

        .post-content {
            line-height: 1.6;
            margin: 1rem 0;
            white-space: pre-wrap;
        }

        .post-link {
            color: var(--accent-color);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: #94a3b8;
        }

        .error {
            color: #fca5a5;
            text-align: center;
            padding: 2rem;
            border: 1px solid #fca5a5;
            border-radius: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌪️ Spotter Network Updates</h1>
            <p>Latest Public Bluesky Posts</p>
        </div>
        <div id="feed">
            <div class="loading">Loading public posts...</div>
        </div>
    </div>

    <script>
        const CORS_PROXY = 'https://corsproxy.io/?';
        const HANDLE = 'spotternetwork.org';
        
        async function fetchData() {
            try {
                // Step 1: Get DID from handle
                const didResponse = await fetch(
                    `${CORS_PROXY}${encodeURIComponent(
                        `https://bsky.social/xrpc/com.atproto.identity.resolveHandle?handle=${HANDLE}`
                    )}`
                );
                
                const didData = await didResponse.json();
                const did = JSON.parse(didData.contents).did;

                // Step 2: Get posts using DID
                const feedResponse = await fetch(
                    `${CORS_PROXY}${encodeURIComponent(
                        `https://bsky.social/xrpc/app.bsky.feed.getAuthorFeed?actor=${did}&limit=10`
                    )}`
                );

                const feedData = await feedResponse.json();
                const posts = JSON.parse(feedData.contents).feed;

                // Step 3: Display posts
                const feedDiv = document.getElementById('feed');
                feedDiv.innerHTML = '';

                posts.forEach(post => {
                    const record = post.post.record;
                    const postDate = new Date(record.createdAt).toLocaleDateString('en-US', {
                        year: 'numeric',
                        month: 'short',
                        day: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit'
                    });

                    feedDiv.innerHTML += `
                        <div class="post-card">
                            <div class="post-content">
                                ${record.text.replace(/\n/g, '<br>')}
                            </div>
                            <div style="margin-top: 1rem; color: #94a3b8;">
                                ${postDate} • 
                                <a href="https://bsky.app/profile/${HANDLE}/post/${post.post.uri.split('/').pop()}" 
                                   class="post-link" 
                                   target="_blank">
                                    View Post ↗
                                </a>
                            </div>
                        </div>
                    `;
                });

            } catch (error) {
                document.getElementById('feed').innerHTML = `
                    <div class="error">
                        Error: ${error.message}<br>
                        <button onclick="window.location.reload()" 
                                style="margin-top: 1rem; padding: 0.5rem 1rem;
                                background: var(--card-bg); border: none;
                                color: var(--accent-color); cursor: pointer;">
                            Try Again
                        </button>
                    </div>
                `;
                console.error('Full error:', error);
            }
        }

        // Initial load
        fetchData();
    </script>
</body>
</html>
