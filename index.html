<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Spotter Network Public Feed</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #7dd3fc;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 2rem;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 3rem;
            padding: 2rem;
            background: rgba(30, 41, 59, 0.5);
            border-radius: 1rem;
        }
        .post-card {
            background: var(--card-bg);
            border-radius: 1rem;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid #334155;
        }
        .post-content {
            line-height: 1.6;
            margin: 1rem 0;
            white-space: pre-wrap;
        }
        .post-link {
            color: var(--accent-color);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .loading {
            text-align: center;
            padding: 2rem;
            color: #94a3b8;
        }
        .error {
            color: #fca5a5;
            text-align: center;
            padding: 2rem;
            border: 1px solid #fca5a5;
            border-radius: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌪️ Spotter Network Updates</h1>
            <p>Public Bluesky Posts</p>
        </div>
        <div id="feed">
            <div class="loading">Loading public posts...</div>
        </div>
    </div>

    <!-- Use browser build instead of ES modules -->
    <script src="https://cdn.jsdelivr.net/npm/@atproto/api@0.6.4/dist/browser/index.js"></script>
    <script>
        const agent = new BskyAgent({
            service: 'https://bsky.social'
        });

        async function getPublicPosts() {
            try {
                const profile = await agent.getProfile({
                    actor: 'spotternetwork.org'
                });

                if (!profile.success) {
                    throw new Error('Profile not found');
                }

                const response = await agent.getAuthorFeed({
                    actor: profile.data.did,
                    limit: 30
                });

                return response.data.feed;
            } catch (error) {
                console.error('API Error:', error);
                throw new Error(`Failed to load posts: ${error.message}`);
            }
        }

        function renderPosts(posts) {
            const feed = document.getElementById('feed');
            feed.innerHTML = '';

            posts.forEach(post => {
                const card = document.createElement('div');
                card.className = 'post-card';
                card.innerHTML = `
                    <div class="post-content">${post.post.record.text.replace(/\n/g, '<br>')}</div>
                    <div style="margin-top: 1rem; color: #94a3b8;">
                        ${new Date(post.post.record.createdAt).toLocaleDateString()} • 
                        <a href="https://bsky.app/profile/spotternetwork.org/post/${post.post.uri.split('/').pop()}" 
                           class="post-link" 
                           target="_blank">
                            View on Bluesky ↗
                        </a>
                    </div>
                `;
                feed.appendChild(card);
            });
        }

        async function loadFeed() {
            try {
                const posts = await getPublicPosts();
                
                if (!posts || posts.length === 0) {
                    throw new Error('No public posts found (try refreshing)');
                }
                
                document.getElementById('feed').innerHTML = '';
                renderPosts(posts);
                
            } catch (error) {
                document.getElementById('feed').innerHTML = `
                    <div class="error">
                        ${error.message}<br>
                        Open browser console (F12) for details
                    </div>
                `;
            }
        }

        loadFeed();
    </script>
</body>
</html>
